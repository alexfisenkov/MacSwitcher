name: Windows port

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-2025
    timeout-minutes: 30
    defaults:
      run:
        working-directory: windows
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: 1
      DOTNET_SKIP_FIRST_TIME_EXPERIENCE: 1
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          dotnet-version: 10.0.403
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'

      - name: Toolchain receipt
        run: |
          dotnet --info
          if ((dotnet --version).Trim() -ne "10.0.403") { throw "Pinned SDK not selected" }

      - name: Build pinned dictionaries
        run: python scripts/build-data.py --output data

      - name: Run Core tests
        run: dotnet run -c Release --project tests/MacSwitcher.Core.Tests

      - name: Extract original app icon
        run: python scripts/extract-icon.py

      - name: Build Windows app
        id: build_app
        shell: pwsh
        run: |
          $version = Get-Content version.json -Raw | ConvertFrom-Json
          $fileVersion = "0.1.$($version.build).0"
          $infoVersion = "$($version.version)+build.$($version.build)"
          dotnet build src/MacSwitcher.Windows/MacSwitcher.Windows.csproj -c Release "/p:FileVersion=$fileVersion" "/p:InformationalVersion=$infoVersion"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Run Windows UI Automation fixture
        shell: pwsh
        run: ./scripts/test-runtime-fixture.ps1

      - name: Prepare verified Inno Setup compiler
        id: inno
        if: ${{ !cancelled() && steps.build_app.outcome == 'success' }}
        shell: pwsh
        run: ./scripts/prepare-inno.ps1

      - name: Build packages
        id: packages
        if: ${{ !cancelled() && steps.inno.outcome == 'success' }}
        shell: pwsh
        run: |
          $compiler = (Get-Content artifacts/inno-setup-receipt.json -Raw | ConvertFrom-Json).compiler
          ./scripts/package.ps1 -InnoCompiler $compiler

      - name: Verify per-user install and user-data preservation
        if: ${{ !cancelled() && steps.packages.outcome == 'success' }}
        shell: pwsh
        run: |
          $version = Get-Content version.json -Raw | ConvertFrom-Json
          ./scripts/test-installer.ps1 -SetupPath "artifacts/MacSwitcher-Windows-$($version.version)-Setup.exe"

      - name: Upload package and source receipts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: MacSwitcher-Windows-0.1.0-alpha.1
          path: |
            windows/artifacts/*.exe
            windows/artifacts/*.zip
            windows/artifacts/*.json
          if-no-files-found: warn
