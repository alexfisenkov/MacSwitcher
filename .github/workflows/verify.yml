name: Final verification
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  macos:
    runs-on: macos-26
    timeout-minutes: 20
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer
    steps:
      - uses: actions/checkout@v4
      - name: Release toolchain
        run: |
          xcodebuild -version
          swift --version
      - name: Publication invariants
        run: |
          python3 script/check_public.py
          python3 script/check_website.py
      - name: Native regressions
        run: |
          swift script/prepare_ci_layouts.swift
          swift test --package-path macos -j 4
      - name: Product tooling
        run: python3 -m unittest discover -s script -p 'test_*.py' -v
      - name: Packaged resources and synthetic prediction benchmark
        run: |
          python3 script/build_app.py --ad-hoc
          .сборки/MacSwitcher.app/Contents/MacOS/RuSwitcher --self-test-resources
          .сборки/MacSwitcher.app/Contents/MacOS/RuSwitcher --benchmark-prediction
      - name: Whitespace
        run: git diff --check
